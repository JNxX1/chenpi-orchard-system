{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="page-head"><h1>修改密码</h1></div>
{% if current_user and current_user.must_change_password %}
<div class="notice red">当前使用的是初始密码，请立即修改，否则任何知道默认密码的人都能登录本系统。</div>
{% endif %}
<div class="card" style="max-width:520px">
  <p class="muted">账号：{{ user.username }}（{{ user.role }}）</p>
  <form method="post">
    <label>原密码 <span class="req">*</span></label>
    <input name="old_password" type="password" autocomplete="current-password" required>
    <label>新密码 <span class="req">*</span></label>
    <input name="new_password" type="password" autocomplete="new-password" minlength="6" required>
    <div class="hint">至少 6 位，建议字母与数字组合。</div>
    <label>确认新密码 <span class="req">*</span></label>
    <input name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
    <div style="margin-top:16px"><button class="btn" type="submit">保存</button>
      <a class="btn o" href="{{ url_for('main.dashboard') }}">返回</a></div>
  </form>
</div>
{% endblock %}
